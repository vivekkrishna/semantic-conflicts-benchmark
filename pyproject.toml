[project]
name = "semantic-conflicts-benchmark"
version = "0.1.0"
description = "Benchmark for measuring LLM ability to detect semantic conflicts across domains"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["benchmark", "llm", "semantic-conflict", "nlp", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "bert-score>=0.3.13",
    "scikit-learn>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
openai     = ["openai>=1.0"]
anthropic  = ["anthropic>=0.25"]
hf         = ["transformers>=4.40", "torch>=2.0"]
all        = ["openai>=1.0", "anthropic>=0.25", "transformers>=4.40", "torch>=2.0"]
dev        = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
scbench = "benchmark.run:main"

[project.urls]
Homepage = "https://github.com/vivekkrishna/semantic-conflicts-benchmark"
Issues   = "https://github.com/vivekkrishna/semantic-conflicts-benchmark/issues"

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
